version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: cat-lai-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: cat-lai-port
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - cat-lai-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cat-lai-backend
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/cat-lai-port?authSource=admin
      JWT_SECRET: your-secret-key-change-in-production
      TOPX_API_URL: http://topx-api.cat-lai.local
      EPORT_API_URL: http://eport-api.cat-lai.local
      5G_TELEMETRY_ENDPOINT: ws://5g-gateway.cat-lai.local:8080
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - cat-lai-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cat-lai-frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:5000
      REACT_APP_WS_URL: ws://localhost:5000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - cat-lai-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: cat-lai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - cat-lai-network
    restart: unless-stopped

volumes:
  mongodb_data:
  mongodb_config:
  redis_data:

networks:
  cat-lai-network:
    driver: bridge
